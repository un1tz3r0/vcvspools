name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: lin-x64
          - os: windows-latest
            platform: win-x64
          - os: macos-latest
            platform: mac-arm64
          - os: macos-latest
            platform: mac-x64
            cross: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux packaging tools
        if: matrix.platform == 'lin-x64'
        run: sudo apt-get update && sudo apt-get install -y jq zstd
      - name: Install macOS packaging tools
        if: startsWith(matrix.platform, 'mac-')
        run: |
          brew install gnu-tar zstd jq
          echo "$(brew --prefix)/opt/gnu-tar/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Install Windows build tools
        if: matrix.platform == 'win-x64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make jq tar zstd
      - name: Download Rack SDK
        shell: bash
        run: |
          curl --fail --location --retry 3 "https://vcvrack.com/downloads/Rack-SDK-2.6.6-${{ matrix.platform }}.zip" -o "$RUNNER_TEMP/rack-sdk.zip"
          unzip -q "$RUNNER_TEMP/rack-sdk.zip" -d "$RUNNER_TEMP"
      - name: Build and package (Unix)
        if: matrix.platform != 'win-x64'
        env:
          CROSS_COMPILE: ${{ matrix.cross }}
        run: |
          jq -e '.version | strings | test("^2\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")' plugin.json
          make -j2 dist RACK_DIR="$RUNNER_TEMP/Rack-SDK"
          test -f dist/Spools-*-${{ matrix.platform }}.vcvplugin
      - name: Build and package (Windows)
        if: matrix.platform == 'win-x64'
        shell: msys2 {0}
        run: |
          jq -e '.version | strings | test("^2\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")' plugin.json
          make -j2 dist RACK_DIR="$(cygpath -u "$RUNNER_TEMP")/Rack-SDK"
          test -f dist/Spools-*-win-x64.vcvplugin
      - uses: actions/upload-artifact@v4
        with:
          name: spools-${{ matrix.platform }}
          path: dist/*.vcvplugin
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version change
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          old_version=""
          if git cat-file -e "$BEFORE:plugin.json" 2>/dev/null; then
            old_version=$(git show "$BEFORE:plugin.json" | jq -er '.version')
          fi
          new_version=$(jq -er '.version' plugin.json)
          python3 - "$old_version" "$new_version" >> "$GITHUB_OUTPUT" <<'PY'
          import re
          import sys

          old, new = sys.argv[1:]
          pattern = r"2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
          if not re.fullmatch(pattern, new) or (old and not re.fullmatch(pattern, old)):
              sys.exit("Versions must use the Rack 2 format 2.minor.patch")
          if old and tuple(map(int, new.split("."))) < tuple(map(int, old.split("."))):
              sys.exit("The plugin version cannot decrease")
          print("publish=" + str(not old or new != old).lower())
          print("tag=v" + new)
          PY
      - name: Download packages
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: spools-*
          path: dist
          merge-multiple: true
      - name: Tag and publish release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          for platform in lin-x64 win-x64 mac-x64 mac-arm64; do
            test -f "dist/Spools-${TAG#v}-${platform}.vcvplugin"
          done
          existing=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          if [ -n "$existing" ]; then
            tag_sha=$(git rev-parse "$TAG^{}")
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG already points to a different commit" >&2
              exit 1
            fi
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "Spools $TAG"
          fi
          gh release upload "$TAG" dist/*.vcvplugin --clobber
